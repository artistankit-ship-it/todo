<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>To-do</title>
<meta name="description" content="Brain dump, prioritise and get things done.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js" defer></script>
<style>
/* iOS layer: Human Interface Guidelines tokens (system font, system colors, grouped backgrounds, 44pt rows,
   materials) applied to the same app structure. Layout: large title → segmented control → inset grouped lists → tab bar. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --elev:#ffffff; --fg:#000000; --muted:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --line:rgba(60,60,67,.18); --hover:rgba(118,118,128,.12); --fill:rgba(118,118,128,.12);
  --accent:#007aff; --onaccent:#ffffff; --check:#007aff; --oncheck:#ffffff; --shadow:rgba(0,0,0,.12);
  --green:#34c759; --q1:#ff3b30; --q2:#5856d6; --q3:#ff9500; --q4:#8e8e93; --bar:rgba(249,249,249,.82); --scrim:rgba(0,0,0,.28);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --elev:#2c2c2e; --fg:#ffffff; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --line:rgba(84,84,88,.45); --hover:rgba(118,118,128,.24); --fill:rgba(118,118,128,.24);
  --accent:#0a84ff; --onaccent:#ffffff; --check:#0a84ff; --oncheck:#ffffff; --shadow:rgba(0,0,0,.5);
  --green:#30d158; --q1:#ff453a; --q2:#5e5ce6; --q3:#ff9f0a; --q4:#8e8e93; --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --elev:#2c2c2e; --fg:#ffffff; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --line:rgba(84,84,88,.45); --hover:rgba(118,118,128,.24); --fill:rgba(118,118,128,.24);
  --accent:#0a84ff; --onaccent:#ffffff; --check:#0a84ff; --oncheck:#ffffff; --shadow:rgba(0,0,0,.5);
  --green:#30d158; --q1:#ff453a; --q2:#5e5ce6; --q3:#ff9f0a; --q4:#8e8e93; --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.5); color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;touch-action:manipulation}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.q1{--qc:var(--q1)} .q2{--qc:var(--q2)} .q3{--qc:var(--q3)} .q4{--qc:var(--q4)}

/* ---- navigation: large title + compact bar on scroll ---- */
.top{display:block;padding:0 4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;min-height:36px;margin-bottom:8px}
.addbtn{background:var(--accent)!important;color:#fff!important}
.addbtn svg{stroke-width:2.4!important}
.dateline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.date{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:-.08px}
h1{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px;margin:2px 0 0}
.navbar{position:fixed;left:0;right:0;top:0;z-index:25;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:-.41px;
  background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid var(--sep);
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.navbar.show{opacity:1}
.ring{position:relative;width:40px;height:40px;flex:none;margin-bottom:2px}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .trk{stroke:var(--fill)} .ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0}
.syncpill{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--fill);color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0;padding:3px 9px 3px 7px;border-radius:20px;cursor:pointer}
.syncpill i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.syncpill[data-state="synced"] i{background:var(--green)}
.syncpill[data-state="syncing"] i,.syncpill[data-state="pending"] i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.syncpill[data-state="error"] i{background:var(--q1)}
.syncpill[data-state="offline"] i,.syncpill[data-state="signedout"] i{background:var(--q3)}
@keyframes pulse{50%{opacity:.3}}

/* ---- tabs: segmented control on wide screens, tab bar on phones ---- */
.tabs{display:flex;gap:0;padding:2px;background:var(--fill);border-radius:9px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;border:0;background:transparent;color:var(--fg);font-size:13px;font-weight:500;letter-spacing:-.08px;padding:6px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.tab[aria-selected="true"]{background:var(--elev);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.tab .ico{display:none}
.tab .n{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .n.zero{display:none}
.tab .n.hot{background:var(--q1);color:#fff;border-radius:9px;min-width:18px;line-height:18px;padding:0 5px;box-sizing:border-box;text-align:center}

/* ---- composer: a "New task" row ---- */
.listview{display:flex;flex-direction:column;gap:14px}
.composer{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:0 12px 0 10px;min-height:44px}
.composer button{order:-1;flex:none;width:24px;height:24px;border:0;border-radius:50%;background:var(--accent);padding:0;cursor:pointer;display:grid;place-items:center}
.composer button svg{width:13px;height:13px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none;display:block}
.composer input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--fg);padding:11px 0;outline:none}
.composer input::placeholder{color:var(--faint)}
.chint{font-size:13px;color:var(--muted);margin:-8px 16px 0;height:0;overflow:hidden;opacity:0;transition:opacity .2s}
.composer:focus-within + .chint.on{height:auto;opacity:1}
.chint code,.lede code,.gfoot code{font-family:var(--mono);font-size:12px;background:var(--fill);border-radius:5px;padding:1px 5px;color:var(--fg)}
.subbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.subbar .spacer{display:none}
.seg{display:flex;flex:1;padding:2px;background:var(--fill);border-radius:9px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--fg);font-size:13px;font-weight:500;letter-spacing:-.08px;padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--elev);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.spacer{flex:1}
.nudge{order:3;flex-basis:100%;display:flex;align-items:center;gap:12px;min-height:44px;box-sizing:border-box;border:0;border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:17px;letter-spacing:-.41px;text-align:left;padding:0 14px 0 12px;cursor:pointer}
.nudge .ni{width:29px;height:29px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.nudge .ni svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.nudge .nv{margin-left:auto;color:var(--muted)}
.nudge::after{content:"";width:7px;height:7px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);transform:rotate(45deg);margin-left:2px}
.nudge:active{background:color-mix(in srgb,var(--fg) 7%,var(--surface))}

/* ---- inset grouped lists ---- */
#list{display:flex;flex-direction:column}
.sect{display:flex;align-items:center;gap:7px;padding:22px 16px 7px;font-size:13px;font-weight:400;letter-spacing:-.08px;text-transform:uppercase;color:var(--muted)}
.sect:first-child{padding-top:4px}
.sect .dot{width:8px;height:8px;border-radius:50%;background:var(--qc,var(--faint))}
.sect .count{font-variant-numeric:tabular-nums}
.sect[data-sect]{cursor:pointer;-webkit-user-select:none;user-select:none}
.sect .chev{margin-left:auto;width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:translateY(-2px) rotate(45deg);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sect.shut .chev{transform:rotate(-45deg)}
.sect .rm + .chev{margin-left:14px}
.sect .rm{margin-left:auto;border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;text-transform:none;padding:0}
ul{list-style:none;margin:0;padding:0}
ul.open,ul.later,ul.finished{background:var(--surface);border-radius:10px;overflow:hidden}
.row{position:relative;display:block;background:var(--surface)}
.rin{position:relative;z-index:1;display:flex;align-items:flex-start;min-height:44px;background:var(--surface);transform:translateX(var(--sx,0px));transition:transform .45s cubic-bezier(.2,1.1,.3,1)}
.row + .row .rin{background-image:linear-gradient(var(--sep),var(--sep));background-size:calc(100% - 50px) .5px;background-position:right top;background-repeat:no-repeat}
.row.swiping .rin{transition:none}
.grip{flex:none;width:22px;align-self:stretch;border:0;background:transparent;color:var(--faint);cursor:grab;touch-action:none;padding:0;display:grid;place-items:center;opacity:0}
.grip::before{content:"";width:8px;height:14px;background-image:radial-gradient(circle,currentColor 1.2px,transparent 1.5px);background-size:4px 4.67px}
.row:hover .grip,.grip:focus-visible{opacity:1}
.nogrip{flex:none;width:22px}
.check{flex:none;width:22px;height:22px;margin:11px 12px 0 -6px;border-radius:50%;border:1.5px solid var(--qc,rgba(60,60,67,.3));background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;position:relative;transition:background .2s,border-color .2s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .check{border-color:var(--qc,rgba(235,235,245,.3))}}
.check::before{content:"";position:absolute;inset:-11px}
.check::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg);opacity:0}
.row.checking .check,.row.done .check{background:var(--qc,var(--accent));border-color:var(--qc,var(--accent))}
.row.checking .check::after,.row.done .check::after{opacity:1}
.row.done .check{--qc:var(--faint)}
.body{flex:1;min-width:0;padding:11px 12px 11px 0}
.title{overflow-wrap:anywhere;outline:none;border-radius:4px}
.title[contenteditable="true"]{background:var(--fill);padding:0 4px;margin:0 -4px}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:15px;letter-spacing:-.24px;color:var(--muted)}
.meta .hot{color:var(--q1)}
.meta .cat::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:2px}
.meta a{color:var(--accent);text-decoration:none}
.more{flex:none;align-self:center;width:30px;height:30px;margin-right:6px;border:0;background:transparent;color:var(--accent);border-radius:50%;cursor:pointer;opacity:0;font-size:14px;letter-spacing:1px}
.row:hover .more,.more:focus-visible,.more[aria-expanded="true"]{opacity:1}
.more:hover{background:var(--fill)}
.row.done .title{color:var(--muted)}
.row.later .title{color:var(--muted)}
.row.later .check{opacity:.5;cursor:default}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:15px}
.fold{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:13px;letter-spacing:-.08px;text-transform:uppercase;padding:22px 16px 7px;cursor:pointer;width:100%;text-align:left}
.fold .count{font-variant-numeric:tabular-nums}
.fold::after{content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);margin-left:auto;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fold[aria-expanded="true"]::after{transform:rotate(45deg) translate(-2px,-2px)}
/* swipe actions sit behind the row, iOS style */
.row::before,.row::after{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:15px;font-weight:600;color:#fff;pointer-events:none;opacity:0}
.row::before{content:"Done";left:20px}
.row::after{content:"Delete";right:20px}
.row.swiping[data-swipe="done"]{background:var(--green)} .row.swiping[data-swipe="del"]{background:var(--q1)}
.row.swiping[data-swipe="done"]::before,.row.swiping[data-swipe="del"]::after{opacity:1}
.row.done.swiping[data-swipe="done"]{background:var(--surface)}
/* drag: the lifted row floats above, the rest glide; group backgrounds hand over to the rows while dragging */
#list{position:relative}
ul.open > .row:first-child,ul.open > .row:first-child > .rin{border-top-left-radius:10px;border-top-right-radius:10px}
ul.open > .row:last-child,ul.open > .row:last-child > .rin{border-bottom-left-radius:10px;border-bottom-right-radius:10px}
body.is-dragging ul.open{overflow:visible;background:transparent}
.row.dragging,.row.dropping{z-index:6;background:transparent;will-change:transform}
.row.dragging .rin,.row.dropping .rin{border-radius:10px;background-image:none}
.row.dragging .rin{transform:scale(1.03);box-shadow:0 14px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .25s}
.row.dropping .rin{transition:transform .3s cubic-bezier(.2,1,.3,1),box-shadow .3s}
.row.dragging + .row .rin,.row.dropping + .row .rin{background-image:none}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ---- task sheet (menu): popover on desktop, sheet on phones ---- */
.menu{position:fixed;z-index:40;width:280px;max-width:calc(100vw - 24px);background:var(--elev);border-radius:14px;box-shadow:0 20px 50px var(--shadow),0 0 0 .5px var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.mh{font-size:13px;letter-spacing:-.08px;text-transform:uppercase;color:var(--muted);padding:6px 4px 0}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mopt{border:0;background:var(--fill);color:var(--fg);font-size:15px;letter-spacing:-.24px;padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.mopt .dot{width:8px;height:8px;border-radius:50%;background:var(--qc,var(--faint))}
.mopt[aria-pressed="true"]{background:var(--accent);color:#fff}
.mopt[aria-pressed="true"] .dot{background:#fff}
.mfield{width:100%;box-sizing:border-box;font:inherit;font-size:17px;color:var(--fg);background:var(--fill);border:0;border-radius:10px;padding:12px 14px}
.mfield:focus{outline:2px solid var(--accent);outline-offset:-2px}
.msep{height:.5px;background:var(--sep);margin:6px 0 2px}
.mrename,.mdel,.mcancel{border:0;background:transparent;font-size:17px;text-align:left;padding:14px 6px;border-radius:9px;cursor:pointer;color:var(--accent)}
.mdel{color:var(--q1)}
.mcancel{display:none}
.mrename:hover,.mdel:hover{background:var(--fill)}

/* ---- toast: iOS-style HUD capsule ---- */
.toast{position:fixed;left:50%;width:max-content;box-sizing:border-box;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;letter-spacing:-.24px;color:var(--fg);
  background:var(--bar);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);box-shadow:0 10px 30px var(--shadow),0 0 0 .5px var(--line)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:15px;padding:0;cursor:pointer}

/* ---- brain dump: grouped sections + Reminders-style boxes ---- */
#dumpview{display:flex;flex-direction:column;gap:26px}
.card{background:var(--surface);border-radius:10px;padding:16px}
.sec{font-size:20px;font-weight:600;letter-spacing:.38px;margin:0}
.lede{margin:4px 0 12px;color:var(--muted);font-size:15px;letter-spacing:-.24px}
.row2{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;letter-spacing:-.08px}
.btn{border:0;background:var(--fill);color:var(--accent);font-size:15px;font-weight:600;letter-spacing:-.24px;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gsec{display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:6px;padding:0 16px 7px;font-size:13px;letter-spacing:-.08px;text-transform:uppercase;color:var(--muted)}
.gcount{font-variant-numeric:tabular-nums}
.ghead .gdot{width:8px;height:8px;border-radius:50%;background:var(--qc)}
.ghint{margin-left:auto;text-transform:none}
.gfoot{margin:0;padding:7px 16px 0;font-size:13px;letter-spacing:-.08px;color:var(--muted)}
.gfoot.center{text-align:center}
.gfoot code{font-family:var(--mono);font-size:12px;background:var(--fill);border-radius:5px;padding:1px 5px;color:var(--fg)}
.group{background:var(--surface);border-radius:10px;overflow:hidden}
.cap textarea{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.4;letter-spacing:-.41px;color:var(--fg);background:transparent;border:0;outline:none;padding:11px 16px;resize:none;min-height:120px;overflow:hidden}
.cap textarea::placeholder{color:var(--faint)}
.bigbtn{display:block;width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;letter-spacing:-.41px;cursor:pointer;transition:opacity .15s,transform .2s cubic-bezier(.2,1.2,.4,1)}
.bigbtn:active:not(:disabled){opacity:.75;transform:scale(.98)}
.bigbtn:disabled{background:var(--fill);color:var(--faint);cursor:default}
.gsec > .bigbtn:first-child{margin-top:0}
.zgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zone{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.zone.wide{grid-column:span 2}
.zone.over{box-shadow:inset 0 0 0 2px var(--qc,var(--accent));background:color-mix(in srgb,var(--qc,var(--accent)) 9%,var(--surface));transform:scale(1.015)}
.zh{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:-.24px;min-width:0}
.zh b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zic{flex:none;width:24px;height:24px;border-radius:7px;background:var(--qc);display:grid;place-items:center}
.zic svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.zic svg.fill{fill:#fff;stroke:none}
.zc{margin-left:auto;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}

const $=id=>document.getElementById(id);
const listEl=$('list'), statusEl=$('status'), tabsEl=$('tabs'), input=$('newtask'), dumpEl=$('dumpview'), listView=$('listview'), subbar=$('subbar'), menu=$('menu');
let artifactNs=null, canSave=true, timer=null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const todayStr=()=>new Date().toLocaleDateString('en-CA');
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function toast(msg,undo){let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML=''; const sp=document.createElement('span'); sp.textContent=msg; t.appendChild(sp);
  if(undo){const b=document.createElement('button'); b.type='button'; b.textContent='Undo'; b.onclick=()=>{undo(); t.hidden=true;}; t.appendChild(b);}
  const wasHid=t.hidden||!t.textContent; t.hidden=false; if(wasHid)anim(t,{y:[24,0],opacity:[0,1],scale:[.94,1]},SPRING); clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true},undo?4500:2200);}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function snapshotList(){const t=tab, copy=JSON.parse(JSON.stringify(data.lists[t])); return ()=>{data.lists[t]=copy; queueSave(); render();};}
function parseCat(raw){const k=raw.indexOf('//'); if(k<0)return {text:raw.trim(),cat:''}; return {text:raw.slice(0,k).trim(),cat:raw.slice(k+2).trim()}}
const REP_RE=/\s+(every\s*day|daily|every\s*weekdays?|weekdays|every\s*week|weekly|every\s*month|monthly)\s*$/i;
function parseRepeat(t){const m=t.match(REP_RE); if(!m)return {text:t,repeat:''}; const w=m[1].toLowerCase().replace(/\s+/g,'');
  const r=w.includes('weekday')?'weekdays':((w.includes('day')||w.includes('dail'))?'daily':w.includes('week')?'weekly':'monthly'); return {text:t.slice(0,m.index).trim(),repeat:r};}
function nextDate(r,from){const d=new Date(from+'T00:00');
  if(r==='daily')d.setDate(d.getDate()+1);
  else if(r==='weekdays'){do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6)}
  else if(r==='weekly')d.setDate(d.getDate()+7);
  else if(r==='monthly')d.setMonth(d.getMonth()+1);
  return d.toLocaleDateString('en-CA');}
const tomorrow=()=>nextDate('daily',todayStr());
const dayLabel=d=>d===todayStr()?'Today':d===tomorrow()?'Tomorrow':fmt(d);
function sameCat(a,b){return !!a&&!!b&&a.toLowerCase()===b.toLowerCase()}
function cats(t){
  if(!data.cats[t])data.cats[t]=[];
  const out=[...data.cats[t]];
  data.lists[t].forEach(i=>{if(i.tag&&!out.some(c=>sameCat(c,i.tag)))out.push(i.tag)});
  return out;
}
function addCat(name,t=tab){const hit=cats(t).find(c=>sameCat(c,name)); if(hit)return hit; data.cats[t].unshift(name); return name;}
const isLater=i=>!i.done&&i.repeat&&i.due&&i.due>todayStr();
const isDueNow=i=>i.due&&i.due<=todayStr();
const L=()=>data.lists[tab];
const find=id=>L().find(i=>i.id===id);
const idx=id=>L().findIndex(i=>i.id===id);

/* ---------- rows ---------- */
function metaHTML(i){
  const p=[];
  if(i.tag&&(group==='priority'||i.done)) p.push(`<span class="cat">${esc(i.tag)}</span>`);
  if(i.due&&!i.done&&(!i.repeat||isLater(i))){const t=todayStr(); if(isLater(i)) p.push(`<span>Back ${dayLabel(i.due).toLowerCase()==='tomorrow'?'tomorrow':'on '+fmt(i.due)}</span>`);
    else if(i.due<t) p.push(`<span class="hot">Overdue · ${fmt(i.due)}</span>`); else if(i.due===t) p.push(`<span class="hot">Today</span>`); else p.push(`<span>${dayLabel(i.due)}</span>`);}
  if(i.q==3&&i.who) p.push(`<span>Waiting on ${esc(i.who)}</span>`);
  if(i.repeat) p.push(`<span>↻ ${repName(i.repeat)}</span>`);
  if(i.ref) p.push(`<a href="${esc(i.ref.url)}" target="_blank" rel="noopener">${esc(i.ref.label)} ↗</a>`);
  return p.length?`<div class="meta">${p.join('')}</div>`:'';
}
function rowHTML(i){
  const later=isLater(i), qk=i.q&&!i.done?Q[i.q].k:'';
  const cls=['row',qk,i.done?'done':'',later?'later':''].filter(Boolean).join(' ');
  return `<li class="${cls}" data-row="${i.id}"><div class="rin">${i.done||later?'<span class="nogrip"></span>':`<button type="button" class="grip" data-grip="${i.id}" aria-label="Drag to reorder: ${esc(i.text)}"></button>`}<button type="button" class="check" data-check="${i.id}" role="checkbox" aria-checked="${!!i.done}" aria-label="${i.done?'Done':'Mark done'}: ${esc(i.text)}"${later?' disabled':''}></button><div class="body"><div class="title" data-title="${i.id}">${esc(i.text)}</div>${metaHTML(i)}</div><button type="button" class="more" data-more="${i.id}" aria-label="Options for ${esc(i.text)}" aria-haspopup="dialog" aria-expanded="${menuFor===i.id}">•••</button></div></li>`;
}
function ul(items,cls,attrs={}){
  const u=document.createElement('ul'); if(cls)u.className=cls; Object.entries(attrs).forEach(([k,v])=>u.dataset[k]=v);
  u.innerHTML=items.map(rowHTML).join(''); return u;
}
function sect(label,count,qk,extra='',key){const h=document.createElement('div'); const shut=key&&collapsed[key]; h.className='sect'+(qk?' '+qk:'')+(shut?' shut':''); if(key){h.dataset.sect=key; h.setAttribute('role','button'); h.setAttribute('aria-expanded',!shut);}
  h.innerHTML=`${qk!==undefined?'<span class="dot"></span>':''}${esc(label)} <span class="count">${count}</span>${extra}${key?'<span class="chev"></span>':''}`; return h;}
const isShut=k=>!!collapsed[k];
function fold(key,label,items,cls){
  const open=!!openFold[key];
  const b=document.createElement('button'); b.type='button'; b.className='fold'; b.dataset.fold=key; b.setAttribute('aria-expanded',open);
  b.innerHTML=`${label} <span class="count">${items.length}</span>`; listEl.appendChild(b);
  if(open) listEl.appendChild(ul(items,cls));
}
function renderList(){
  const items=L(), open=items.filter(i=>!i.done&&!isLater(i)), later=items.filter(isLater), fin=items.filter(i=>i.done);
  listEl.innerHTML='';
  if(group==='priority'){
    const G=[['1','Do first','q1',i=>i.q==1||(i.q==2&&isDueNow(i))],['2','Scheduled','q2',i=>i.q==2&&!isDueNow(i)],['3','Delegated','q3',i=>i.q==3],['0','No priority','',i=>!i.q],['4','Maybe drop','q4',i=>i.q==4]];
    G.forEach(([k,name,qk,test])=>{
      let its=open.filter(test); if(!its.length)return;
      if(k==='2')its=its.slice().sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
      const key=tab+':p'+k; listEl.appendChild(sect(name,its.length,qk,'',key)); if(!isShut(key)) listEl.appendChild(ul(its,'open',{pq:k}));
    });
  }else{
    const loose=open.filter(i=>!i.tag);
    if(loose.length) listEl.appendChild(ul(loose,'open',{cat:''}));
    cats(tab).forEach(c=>{
      const op=open.filter(i=>sameCat(i.tag,c)), any=items.some(i=>sameCat(i.tag,c));
      if(any&&!op.length)return;
      const key=tab+':c'+c.toLowerCase(); listEl.appendChild(sect(c,op.length,undefined,`<button type="button" class="rm" data-delcat="${esc(c)}">Remove</button>`,op.length?key:undefined));
      if(op.length&&!isShut(key)) listEl.appendChild(ul(op,'open',{cat:c}));
      else{const e=document.createElement('div'); e.className='empty'; e.style.padding='6px 10px 10px'; e.style.textAlign='left'; e.textContent=`Empty. Type "task //${c}" to add one.`; listEl.appendChild(e);}
    });
  }
  if(!open.length) {const e=document.createElement('div'); e.className='empty'; e.textContent=items.length?'All clear. Nice work.':'Nothing here yet. Add your first task above.'; listEl.prepend(e);}
  if(later.length) fold('later','Repeating later',later.sort((a,b)=>a.due<b.due?-1:1),'later');
  if(fin.length) fold('done','Completed',fin,'finished');
  setRing(fin.length,items.length-later.length);
}
function setRing(done,total){
  const f=total?done/total:0; $('ringval').style.strokeDashoffset=119.4*(1-f);
  $('ringtxt').textContent=`${done}/${total}`; $('ring').setAttribute('aria-label',`${done} of ${total} done`);
}
function renderSubbar(){subbar.innerHTML=''; subbar.hidden=true;}

/* ---------- motion: springs via the Motion library, with a Web Animations fallback ---------- */
const SPRING={type:'spring',stiffness:520,damping:42,mass:1}, SOFT={type:'spring',stiffness:300,damping:30,mass:1};
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function anim(el,kf,opts={}){
  if(!el||prefersReduced)return Promise.resolve();
  try{ if(window.Motion&&window.Motion.animate){const c=window.Motion.animate(el,kf,{...SPRING,...opts}); return (c&&c.finished)||Promise.resolve();} }catch(e){}
  const tf=(o)=>`translate(${o.x||0}px,${o.y||0}px) scale(${o.scale==null?1:o.scale})`;
  const pick=(k,n)=>{const v=kf[k]; return Array.isArray(v)?v[n]:(n?v:undefined)};
  const f0={},f1={}; ['x','y','scale'].forEach(k=>{if(kf[k]!=null){f0[k]=pick(k,0);f1[k]=pick(k,1);}});
  const a={transform:tf(f0)},b={transform:tf(f1)}; if(kf.opacity!=null){a.opacity=pick('opacity',0);b.opacity=pick('opacity',1)}
  if(kf.height!=null){a.height=pick('height',0)+'px';b.height=pick('height',1)+'px'}
  try{return el.animate([a,b],{duration:(opts.duration||.32)*1000,easing:'cubic-bezier(.2,.9,.25,1.05)',fill:'forwards'}).finished.catch(()=>{})}catch(e){return Promise.resolve()}
}
function collapse(row){const h=row.offsetHeight; row.style.overflow='hidden'; return anim(row,{height:[h,0],opacity:[1,0]},{type:'tween',duration:.24,ease:[.4,0,.2,1]});}
const phone=()=>innerWidth<=640;

/* ---------- menu ---------- */
function openMenu(id){
  const it=find(id); if(!it){closeMenu();return}
  menuFor=id;
  let h='';
  if(it.done){
    h=`<button type="button" class="mopt" data-mundo>Mark as not done</button><div class="msep"></div><button type="button" class="mdel" data-mdel>Delete task</button><button type="button" class="mcancel" data-mcancel>Cancel</button>`;
  }else{
    h=`<div class="mh">Priority</div><div class="mopts">${[1,2,3,0].map(q=>`<button type="button" class="mopt ${q?Q[q].k:''}" data-mq="${q}" aria-pressed="${(it.q||0)==q}"><span class="dot"></span>${q?Q[q].name:'None'}</button>`).join('')}</div>`;
    if(it.q==2) h+=`<input type="date" class="mfield" data-mdue value="${it.due||todayStr()}" aria-label="Date">`;
    if(it.q==3) h+=`<input class="mfield" data-mwho value="${esc(it.who||'')}" placeholder="Who is doing it?" aria-label="Who">`;
    h+=`<div class="mh">Repeat</div><div class="mopts">${REP.map(([v,n])=>`<button type="button" class="mopt" data-mrep="${v}" aria-pressed="${(it.repeat||'')===v}">${n}</button>`).join('')}</div>`;
    const cs=cats(tab);
    h+=`<div class="mh">Category</div><select class="mfield" data-mcat aria-label="Category"><option value="">None</option>${cs.map(c=>`<option${sameCat(c,it.tag)?' selected':''}>${esc(c)}</option>`).join('')}</select>`;
    h+=`<div class="msep"></div><button type="button" class="mrename" data-mrename>Rename</button><button type="button" class="mdel" data-mdel>Delete task</button><button type="button" class="mcancel" data-mcancel>Cancel</button>`;
  }
  const wasHidden=menu.hidden; menuToken++;
  menu.innerHTML=h; menu.hidden=false; menu.style.transform=''; placeMenu();
  if(wasHidden){ if(phone()) anim(menu,{y:[menu.offsetHeight+40,0]},SOFT); else anim(menu,{opacity:[0,1],scale:[.94,1],y:[-6,0]},SPRING); }
}
let menuToken=0;
function placeMenu(){
  const b=listEl.querySelector(`[data-more="${menuFor}"]`); if(!b){closeMenu();return}
  listEl.querySelectorAll('[data-more]').forEach(x=>x.setAttribute('aria-expanded',x===b));
  if(innerWidth<=640)return;
  const r=b.getBoundingClientRect(), mh=menu.offsetHeight, mw=menu.offsetWidth;
  let top=r.bottom+6; if(top+mh>innerHeight-12) top=Math.max(12,r.top-mh-6);
  let left=Math.min(r.right-mw, innerWidth-mw-12); left=Math.max(12,left);
  menu.style.top=top+'px'; menu.style.left=left+'px';
}
function closeMenu(){
  const was=menuFor!==null&&!menu.hidden; menuFor=null; listEl.querySelectorAll('[data-more][aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));
  if(!was){menu.hidden=true;return}
  const tok=++menuToken; const done=()=>{if(tok===menuToken){menu.hidden=true; menu.style.transform=''; menu.style.opacity='';}};
  if(phone()) anim(menu,{y:[0,menu.offsetHeight+40]},{type:'tween',duration:.22,ease:[.4,0,1,1]}).then(done);
  else anim(menu,{opacity:[1,0],scale:[1,.96]},{type:'tween',duration:.12}).then(done);
}
function refreshKeepMenu(){const id=menuFor; render(); queueSave(); if(id)openMenu(id);}
menu.addEventListener('click',e=>{
  if(e.target.closest('[data-mcancel]')){closeMenu();return}
  const it=find(menuFor); if(!it)return;
  const q=e.target.closest('[data-mq]'); if(q){const v=+q.dataset.mq; if(v)it.q=v; else delete it.q; if(v===2&&!it.due)it.due=todayStr(); if(v!==2&&!it.repeat)delete it.due; refreshKeepMenu(); return}
  const r=e.target.closest('[data-mrep]'); if(r){const v=r.dataset.mrep; if(v)it.repeat=v; else {delete it.repeat; if(it.q!=2)delete it.due;} refreshKeepMenu(); return}
  if(e.target.closest('[data-mrename]')){const id=it.id; closeMenu(); const t=listEl.querySelector(`[data-title="${id}"]`); if(t)startEdit(t); return}
  if(e.target.closest('[data-mdel]')){const undo=snapshotList(); L().splice(idx(it.id),1); closeMenu(); render(); queueSave(); toast('Deleted',undo); return}
  if(e.target.closest('[data-mundo]')){const arr=L(); arr.splice(idx(it.id),1); it.done=false; arr.unshift(it); closeMenu(); render(); queueSave(); return}
});
menu.addEventListener('change',e=>{
  const it=find(menuFor); if(!it)return;
  if(e.target.matches('[data-mdue]')){if(e.target.value)it.due=e.target.value; refreshKeepMenu();}
  if(e.target.matches('[data-mcat]')){if(e.target.value)it.tag=e.target.value; else delete it.tag; refreshKeepMenu();}
});
menu.addEventListener('input',e=>{const it=find(menuFor); if(it&&e.target.matches('[data-mwho]')){it.who=e.target.value.trim(); if(!it.who)delete it.who; queueSave();}});
menu.addEventListener('focusout',e=>{if(e.target.matches('[data-mwho]')){const id=menuFor; render(); if(id)openMenu(id);}});
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!e.target.closest('[data-more]'))closeMenu();},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){const id=menuFor; closeMenu(); const b=listEl.querySelector(`[data-more="${id}"]`); if(b)b.focus();}});
addEventListener('resize',()=>{if(menuFor)placeMenu()});
document.addEventListener('scroll',()=>{if(menuFor)placeMenu()},{passive:true,capture:true});

/* ---------- list events ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function complete(id){
  const it=find(id); if(!it)return; buzz();
  const undo=snapshotList();
  if(it.repeat){it.due=nextDate(it.repeat,todayStr()); it.last=todayStr(); render(); queueSave(); toast(`Done. Back ${dayLabel(it.due)==='Tomorrow'?'tomorrow':'on '+fmt(it.due)}.`,undo); return;}
  const arr=L(); arr.splice(idx(id),1); it.done=true;
  const fd=arr.findIndex(i=>i.done); arr.splice(fd<0?arr.length:fd,0,it);
  render(); queueSave(); toast('Completed',undo);
}
listEl.addEventListener('click',e=>{
  const c=e.target.closest('[data-check]');
  if(c){const it=find(c.dataset.check); if(!it||isLater(it))return;
    if(it.done){openMenu(it.id);return}
    const row=c.closest('.row'); row.classList.add('checking'); c.setAttribute('aria-checked','true'); buzz();
    anim(c,{scale:[.6,1.15,1]},{type:'spring',stiffness:700,damping:18});
    setTimeout(()=>{ if(it.repeat){complete(it.id);return} collapse(row).then(()=>complete(it.id)); },prefersReduced?0:320); return;}
  if(swipedAt&&Date.now()-swipedAt<350)return;
  const touch=matchMedia('(hover:none)').matches;
  const bd=e.target.closest('.row .body');
  if(touch&&bd&&!e.target.closest('a')&&!e.target.closest('[contenteditable="true"]')){const id=bd.closest('.row').dataset.row; if(menuFor===id)closeMenu(); else openMenu(id); return}
  const m=e.target.closest('[data-more]'); if(m){if(menuFor===m.dataset.more)closeMenu(); else openMenu(m.dataset.more); return}
  const sc=e.target.closest('[data-sect]'); if(sc&&!e.target.closest('button')){const k=sc.dataset.sect; if(collapsed[k])delete collapsed[k]; else collapsed[k]=1; store('todo-collapsed',JSON.stringify(collapsed)); buzz(); render(); return}
  const f=e.target.closest('[data-fold]'); if(f){const k=f.dataset.fold; openFold[k]=!openFold[k]; store('todo-fold',JSON.stringify(openFold)); render(); return}
  const dc=e.target.closest('[data-delcat]');
  if(dc){const c2=dc.dataset.delcat; data.cats[tab]=(data.cats[tab]||[]).filter(x=>!sameCat(x,c2)); L().forEach(i=>{if(sameCat(i.tag,c2))delete i.tag}); render(); queueSave(); return}
});
/* edit a title in place: double-click (or Enter on a focused title) */
listEl.addEventListener('dblclick',e=>{const t=e.target.closest('[data-title]'); if(!t||t.closest('.done'))return; startEdit(t);});
function startEdit(t){t.contentEditable='true'; t.focus(); const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}
listEl.addEventListener('keydown',e=>{
  const t=e.target.closest('[data-title][contenteditable="true"]');
  if(t&&e.key==='Enter'){e.preventDefault(); t.blur();}
  if(t&&e.key==='Escape'){t.textContent=find(t.dataset.title).text; t.blur();}
});
listEl.addEventListener('focusout',e=>{const t=e.target.closest('[data-title][contenteditable="true"]'); if(!t)return;
  t.contentEditable='false'; const it=find(t.dataset.title), v=t.textContent.trim(); if(it&&v&&v!==it.text){it.text=v; queueSave();} render();});

/* swipe on touch: right = complete, left = delete (both undoable) */
let sw=null, swipedAt=0;
listEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;

}
function writeLocal(){try{localStorage.setItem(LS_DATA,JSON.stringify(data)); localStorage.setItem(LS_META,JSON.stringify(meta));}catch(e){statusEl.textContent='Storage is full or blocked. Download a backup from Settings.';}}
function normalize(d){d.lists=d.lists||{}; LISTS.forEach(t=>{if(!d.lists[t.id])d.lists[t.id]=[]}); d.inbox=d.inbox||[]; d.someday=d.someday||[]; d.cats=d.cats||{}; d.deleted=d.deleted||{}; return dedupe(d);}
/* an item lives in exactly one place: when it moved (inbox -> someday, someday -> inbox), keep only its newest copy */
function dedupe(d){
  const arrs=[...Object.values(d.lists),d.inbox,d.someday], best=new Map();
  arrs.forEach(a=>a.forEach(i=>{const b=best.get(i.id); if(!b||(i.u||0)>(b.u||0))best.set(i.id,i);}));
  const keep=a=>a.filter(i=>best.get(i.id)===i);
  Object.keys(d.lists).forEach(k=>d.lists[k]=keep(d.lists[k])); d.inbox=keep(d.inbox); d.someday=keep(d.someday); return d;}
function mergeArr(L,R,del){
  const lmap=new Map(L.map(i=>[i.id,i])), rmap=new Map(R.map(i=>[i.id,i])), out=[];
  const gone=i=>del[i.id]!==undefined&&del[i.id]>=(i.u||0);
  R.forEach(i=>{if(!lmap.has(i.id)&&!gone(i))out.push(i)});
  L.forEach(i=>{const r=rmap.get(i.id); const p=(r&&(r.u||0)>(i.u||0))?r:i; if(!gone(p))out.push(p)});
  return out;
}
function merge(local,remote){
  remote=normalize(JSON.parse(JSON.stringify(remote))); local=normalize(local);
  const del={...remote.deleted}; Object.entries(local.deleted).forEach(([k,v])=>{if(!del[k]||v>del[k])del[k]=v});
  const out={...remote,...local,deleted:del,lists:{},cats:{}};
  new Set([...Object.keys(local.lists),...Object.keys(remote.lists)]).forEach(k=>out.lists[k]=mergeArr(local.lists[k]||[],remote.lists[k]||[],del));
  out.inbox=mergeArr(local.inbox,remote.inbox,del); out.someday=mergeArr(local.someday,remote.someday,del);
  new Set([...Object.keys(local.cats),...Object.keys(remote.cats)]).forEach(k=>{const a=[...(local.cats[k]||[])]; (remote.cats[k]||[]).forEach(c=>{if(!a.some(x=>sameCat(x,c)))a.push(c)}); out.cats[k]=a;});
  return dedupe(out);
}
function persist(){stamp(); meta.dirty=true; writeLocal(); setSync(syncOn&&user?'pending':syncState); }
function queueSave(){persist(); clearTimeout(timer); if(syncOn&&user) timer=setTimeout(syncNow,1200);}
async function syncNow(){
  if(!syncOn||!user||syncing)return; if(!navigator.onLine){setSync('offline');return}
  syncing=true; setSync('syncing');
  try{
    const {data:row,error}=await sb.from('todo_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(row&&row.updated_at!==meta.remoteAt){
      if(meta.dirty){data=merge(data,row.data);} else {data=normalize(row.data); meta.remoteAt=row.updated_at; takeSnap(); writeLocal(); render();}
      if(meta.dirty){takeSnap(); render();}
    }
    if(meta.dirty||!row){
      const at=new Date().toISOString();
      const {error:e2}=await sb.from('todo_state').upsert({user_id:user.id,data,updated_at:at});
      if(e2)throw e2;
      meta.remoteAt=at; meta.dirty=false; writeLocal();
    }
    setSync('synced');
  }catch(err){lastErr=(err&&err.message)||String(err); setSync('error');}
  finally{syncing=false;}
}
function setSync(s){syncState=s; const el=$('syncpill'); if(!el)return;
  const label={local:'On this device',pending:'Saving…',syncing:'Syncing…',synced:'Synced',offline:'Offline',error:'Sync problem',signedout:'Sign in to sync'}[s]||s;
  el.dataset.state=s; el.querySelector('span').textContent=label;
  statusEl.textContent=s==='error'?`Sync failed: ${lastErr}. Your changes are safe on this device.`:'';}

/* settings sheet: sign in with an emailed code (works inside the Home Screen app), backup, restore */
const sheet=$('sheet');

function renderSheet(){
  let h=`<div class="sheet-head"><h2 class="sec">Settings</h2><button type="button" class="cx" data-close aria-label="Close">×</button></div>`;
  if(!syncOn){
    h+=`<section><h3>Sync</h3><p class="lede">Sync is off, so your tasks are saved on this device only. To sync with your other devices, add your Supabase details to <code>config.js</code> (see SETUP.md).</p></section>`;
  }else if(!user){
    h+=`<section><h3>Sync across devices</h3><p class="lede">Sign in with the same email and password on each device. First time? Choose <b>Create account</b>, click the link in the confirmation email, then come back and sign in.</p>
      <form id="authform" class="sform"><input id="email" class="mfield" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email" required>
      <input id="pass" class="mfield" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" aria-label="Password" minlength="8" required>
      <div class="srow"><button class="btn primary" type="submit" data-mode="in">Sign in</button><button class="btn" type="submit" data-mode="up">Create account</button></div></form></section>`;
  }else{
    h+=`<section><h3>Sync</h3><p class="lede">Signed in as ${esc(user.email||'you')}. Changes sync automatically when you're online.</p>
      <div class="srow"><button type="button" class="btn" data-syncnow>Sync now</button><button type="button" class="btn ghost" data-signout>Sign out</button></div></section>`;
  }
  h+=`<section><h3>Backup</h3><p class="lede">Save a copy of all your tasks as a file, or restore one.</p>
    <div class="srow"><button type="button" class="btn" data-backup>Download backup</button><label class="btn">Restore…<input type="file" id="restore" accept="application/json,.json" hidden></label></div></section>
    <p class="muted" style="margin:4px 0 0">${['standalone','fullscreen'].some(m=>matchMedia(`(display-mode: ${m})`).matches)||navigator.standalone?'Running as an app.':'Tip: add this page to your Home Screen (iPhone) or Dock (Mac) to use it as an app.'}</p>`;
  sheet.querySelector('.sheet-card').innerHTML=h;
}
function openSheet(){renderSheet(); sheet.hidden=false; anim(sheet.querySelector('.sheet-card'),{y:[phone()?420:30,0],opacity:[phone()?1:0,1]},SOFT); anim(sheet,{opacity:[0,1]},{type:'tween',duration:.2}); const f=sheet.querySelector('input:not([type=file]),button'); if(f)f.focus();}
function closeSheet(){sheet.hidden=true; $('syncpill').focus();}
$('syncpill').addEventListener('click',openSheet);
sheet.addEventListener('click',async e=>{
  if(e.target===sheet||e.target.closest('[data-close]')){closeSheet();return}
  if(e.target.closest('[data-syncnow]')){await syncNow(); renderSheet(); toast(syncState==='synced'?'Synced':'Could not sync'); return}
  if(e.target.closest('[data-signout]')){await sb.auth.signOut(); user=null; setSync('signedout'); renderSheet(); return}
  if(e.target.closest('[data-backup]')){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`todo-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); return}
});
sheet.addEventListener('change',async e=>{
  if(e.target.id!=='restore'||!e.target.files[0])return;
  try{const d=JSON.parse(await e.target.files[0].text()); if(!d||!d.lists)throw new Error('not a to-do backup');
    data=normalize(d); queueSave(); render(); closeSheet(); toast('Backup restored');}
  catch(err){toast('That file is not a to-do backup.');}
});
sheet.addEventListener('submit',async e=>{
  e.preventDefault(); if(e.target.id!=='authform')return;
  const mode=(e.submitter&&e.submitter.dataset.mode)||'in', em=$('email').value.trim(), pw=$('pass').value;
  if(!em||pw.length<8){toast('Enter your email and a password of at least 8 characters.');return}
  const btns=e.target.querySelectorAll('button'); btns.forEach(x=>x.disabled=true);
  if(mode==='up'){
    const {data:res,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}});
    btns.forEach(x=>x.disabled=false);
    if(error){toast(error.message);return}
    if(res.session){user=res.user; meta.dirty=true; writeLocal(); await syncNow(); renderSheet(); toast('Account created. Sync is on.');return}
    toast('Check your email and click the confirmation link, then sign in here.'); return;
  }
  const {data:res,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  btns.forEach(x=>x.disabled=false);
  if(error){toast(/confirm/i.test(error.message)?'Confirm your email first: click the link we sent you.':'Wrong email or password.');return}
  user=res.user; meta.dirty=true; writeLocal(); await syncNow(); renderSheet(); toast('Signed in. Sync is on.');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet();});

/* start */
(function boot(){
  let saved=null; try{saved=JSON.parse(localStorage.getItem(LS_DATA)||'null')}catch(e){}
  data=normalize(saved||data); takeSnap(); if(!saved){writeLocal();}
  render();
  if(!syncOn){setSync('local');return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'todo-app-auth'}});
  sb.auth.getSession().then(({data:s})=>{user=s&&s.session?s.session.user:null; if(user){syncNow()} else setSync('signedout');});
  sb.auth.onAuthStateChange((_ev,session)=>{user=session?session.user:null;});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
  addEventListener('online',syncNow); addEventListener('offline',()=>setSync('offline'));
  setInterval(()=>{if(document.visibilityState==='visible')syncNow()},45000);
})();
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
